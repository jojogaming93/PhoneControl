name: Build Windows installer and release
on:
  push:
    branches: ['release/**']
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Installer version; must match a selected release/version branch
        required: true
        default: '1.0.9'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve branch or tag version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $release = ./scripts/Resolve-ReleaseVersion.ps1 -EventName $env:EVENT_NAME -RefType $env:REF_TYPE -RefName $env:REF_NAME -InputVersion $env:INPUT_VERSION
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "branch=$($release.ReleaseBranch)" >> $env:GITHUB_OUTPUT
  installer:
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/windows-installer.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ needs.resolve.outputs.tag }}
      commit: ${{ github.sha }}
      release_branch: ${{ needs.resolve.outputs.branch }}
