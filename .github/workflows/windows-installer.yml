name: Reusable tested Windows installer
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      source_branch:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: installer-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Resolve installer version and release tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          $identity = ./scripts/Get-ReleaseIdentity.ps1 -Version $env:RELEASE_VERSION
          if (($env:RELEASE_TAG -creplace '^v', '') -cne $identity.Version -or $env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Invalid release inputs.' }
          if ((git rev-parse HEAD) -ne $env:RELEASE_COMMIT) { throw 'Checkout does not match release source.' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
      - name: Regenerate the offline guide
        shell: pwsh
        run: |
          python docs/generate_fixtures.py
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed.' }
          python docs/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Guide generation failed.' }
          git diff --exit-code -- docs
          if ($LASTEXITCODE -ne 0) { throw 'Commit regenerated documentation and fixtures.' }
          python scripts/Check-PublicSource.py
          if ($LASTEXITCODE -ne 0) { throw 'Public source audit failed.' }
          ./scripts/Test-ReleaseAutomation.ps1
      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: ./scripts/Build-Installer.ps1 -Version $env:RELEASE_VERSION -SourceBranch $env:SOURCE_BRANCH
      - name: Verify install, repair, uninstall and retained profiles
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/Test-Installer.ps1 -Version $env:RELEASE_VERSION -Installer "artifacts/releases/PhoneControl-Setup-$env:RELEASE_VERSION-win-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: PhoneControl-installer-x64
          path: |
            artifacts/releases/PhoneControl-Setup-*.exe
            artifacts/releases/PhoneControl-*-source.zip
            artifacts/releases/*.sha256
            artifacts/releases/*-manifest.json
            artifacts/installer-test-*/installer-results.txt
            artifacts/installer-test-*/self-test-results.txt
            artifacts/installer-test-*/*.log
            artifacts/installer-staging/**/self-test-results.txt
          if-no-files-found: error
      - name: Upload tested release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhoneControl-release-files
          path: |
            artifacts/releases/PhoneControl-Setup-${{ inputs.version }}-win-x64.exe
            artifacts/releases/PhoneControl-Setup-${{ inputs.version }}-win-x64.exe.sha256
            artifacts/releases/PhoneControl-${{ inputs.version }}-source.zip
            artifacts/releases/PhoneControl-${{ inputs.version }}-manifest.json
          if-no-files-found: error
  release:
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhoneControl-release-files
          path: artifacts/release-files
      - name: Publish tested installer and corresponding source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_BRANCH: ${{ inputs.source_branch }}
        run: |
          ./scripts/New-GitHubRelease.ps1 -Version $env:RELEASE_VERSION -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Repository $env:GITHUB_REPOSITORY -ArtifactDirectory artifacts/release-files -SourceBranch $env:RELEASE_BRANCH
          "[Download PhoneControl $env:RELEASE_VERSION](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG)" >> $env:GITHUB_STEP_SUMMARY
  retention:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: preview-retention-${{ inputs.source_branch || inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Retain recent alpha and beta installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          $identity = ./scripts/Get-ReleaseIdentity.ps1 -Version $env:RELEASE_VERSION
          ./scripts/Remove-OldPreviewReleases.ps1 -Repository $env:GITHUB_REPOSITORY -Channel $identity.Channel -SourceBranch $env:SOURCE_BRANCH -KeepTag $env:RELEASE_TAG
