name: Build Windows installer and release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (major.minor.patch)
        required: true
        default: '1.0.8'
permissions:
  contents: read
concurrency:
  group: installer-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve installer version and release tag
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:TAG_NAME } else { $env:INPUT_VERSION }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version/tag must be major.minor.patch, optionally prefixed with v.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate the offline guide
        run: |
          python docs/generate_fixtures.py
          python docs/build.py
          python scripts/Check-PublicSource.py
      - name: Build unsigned validation installer (not for public distribution)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Build-Installer.ps1 -Version $env:RELEASE_VERSION -AllowUnsigned
      - name: Verify install, repair, uninstall and retained profiles
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Test-Installer.ps1 -Installer "artifacts/unsigned-validation/PhoneControl-Setup-$env:RELEASE_VERSION-win-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: PhoneControl-unsigned-validation-x64
          path: |
            artifacts/unsigned-validation/PhoneControl-Setup-*.exe
            artifacts/unsigned-validation/PhoneControl-*-source.zip
            artifacts/unsigned-validation/*.sha256
            artifacts/unsigned-validation/*-manifest.json
            artifacts/installer-test-*/installer-results.txt
            artifacts/installer-test-*/self-test-results.txt
            artifacts/installer-test-*/*.log
          if-no-files-found: error
      - name: Upload tested release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhoneControl-release-files
          path: |
            artifacts/unsigned-validation/PhoneControl-Setup-${{ steps.version.outputs.version }}-win-x64.exe
            artifacts/unsigned-validation/PhoneControl-Setup-${{ steps.version.outputs.version }}-win-x64.exe.sha256
            artifacts/unsigned-validation/PhoneControl-${{ steps.version.outputs.version }}-source.zip
            artifacts/unsigned-validation/PhoneControl-${{ steps.version.outputs.version }}-manifest.json
          if-no-files-found: error
  release:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhoneControl-release-files
          path: artifacts/release-files
      - name: Create draft release with installer and corresponding source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.installer.outputs.version }}
          RELEASE_TAG: ${{ needs.installer.outputs.tag }}
        run: ./scripts/New-GitHubRelease.ps1 -Version $env:RELEASE_VERSION -Tag $env:RELEASE_TAG -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -ArtifactDirectory artifacts/release-files
